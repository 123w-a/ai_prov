<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>LangGraph 编排全图 v2</title>
<style>
  body { margin: 0; padding: 0; background: #f7f3ec; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
  svg { display: block; }
</style>
</head>
<body>
<svg width="1280" height="1780" viewBox="0 0 1280 1780" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#777"/>
    </marker>
    <marker id="arrow-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c02020"/>
    </marker>
    <marker id="arrow-black" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="1780" fill="#f7f3ec"/>

  <!-- 标题 -->
  <text x="40" y="50" font-size="28" font-weight="bold" fill="#222">
    <tspan fill="#c89028">▍</tspan>二 · LangGraph 编排全图（13 节点 · 2 条回环已标红加粗）
  </text>
  <text x="40" y="78" font-size="14" fill="#888">入口 ↓</text>

  <!-- ==================== 边（先画边，节点盖在上面） ==================== -->

  <!-- 主链普通边（实线） -->
  <line x1="420" y1="158" x2="420" y2="210" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="435" y="188" font-size="12" fill="#666">① 普通边</text>

  <!-- ingredient_gate --ready--> profile_gate -->
  <line x1="420" y1="278" x2="420" y2="330" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="435" y="308" font-size="12" fill="#666">ready：清单已确认</text>

  <!-- profile_gate --ready--> requested_dish_gate -->
  <line x1="420" y1="398" x2="420" y2="450" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="435" y="428" font-size="12" fill="#666">ready：信息足够</text>

  <!-- requested_dish_gate --pass--> chef_think -->
  <line x1="420" y1="518" x2="420" y2="590" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="435" y="558" font-size="12" fill="#666">pass：未命中已确认过敏原</text>

  <!-- chef_think --verify--> verify_answer（主链，绕过 run_tools） -->
  <line x1="420" y1="658" x2="420" y2="920" stroke="#777" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-dash)"/>
  <text x="435" y="790" font-size="12" fill="#666">verify：不调工具，直接审计</text>

  <!-- verify_answer --ok/degraded--> structure_answer -->
  <line x1="420" y1="988" x2="420" y2="1060" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="435" y="1028" font-size="12" fill="#666">ok / degraded</text>

  <!-- structure_answer -> profile_memory -->
  <line x1="420" y1="1128" x2="420" y2="1180" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- profile_memory -> END -->
  <line x1="420" y1="1248" x2="420" y2="1310" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ 条件边：右侧水平 ============ -->

  <!-- ingredient_gate --ask--> ingredient_confirm -->
  <line x1="540" y1="244" x2="700" y2="244" stroke="#777" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-dash)"/>
  <text x="580" y="236" font-size="12" fill="#666">ask：确认</text>

  <!-- profile_gate --ask--> ask_user -->
  <line x1="540" y1="364" x2="700" y2="364" stroke="#777" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-dash)"/>
  <text x="580" y="356" font-size="12" fill="#666">ask：信息不足</text>

  <!-- requested_dish_gate --blocked--> 右侧母线 -->
  <line x1="540" y1="484" x2="1100" y2="484" stroke="#777" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-dash)"/>
  <text x="700" y="476" font-size="12" fill="#666">blocked：命中已确认过敏原 → 直接 END</text>

  <!-- chef_think --tools--> run_tools -->
  <line x1="540" y1="624" x2="700" y2="624" stroke="#777" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-dash)"/>
  <text x="580" y="616" font-size="12" fill="#666">tools</text>

  <!-- chef_think --tool_budget_exhausted--> tool_budget_finalize（向左） -->
  <line x1="300" y1="624" x2="250" y2="624" stroke="#777" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-dash)"/>
  <text x="130" y="616" font-size="12" fill="#666">预算耗尽</text>

  <!-- tool_budget_finalize -> verify_answer（左下绕到 verify 左侧） -->
  <path d="M 130 658 L 130 954 L 300 954" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- verify_answer --blocked--> allergen_block -->
  <line x1="540" y1="930" x2="700" y2="930" stroke="#777" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-dash)"/>
  <text x="580" y="922" font-size="12" fill="#666">blocked</text>

  <!-- verify_answer --plain--> 右侧母线 -->
  <line x1="540" y1="978" x2="1100" y2="978" stroke="#777" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-dash)"/>
  <text x="700" y="970" font-size="12" fill="#666">plain：纯问答直通 END</text>

  <!-- allergen_block -> 右侧母线 -->
  <line x1="940" y1="930" x2="1100" y2="930" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ingredient_confirm -> 右侧母线 -->
  <line x1="940" y1="244" x2="1100" y2="244" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ask_user -> 右侧母线 -->
  <line x1="940" y1="364" x2="1100" y2="364" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 右侧公共母线：从 y=244 一直到 END 右侧 -->
  <line x1="1100" y1="244" x2="1100" y2="1338" stroke="#555" stroke-width="1.5"/>
  <!-- 母线汇入 END 右侧 -->
  <line x1="1100" y1="1338" x2="580" y2="1338" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ 回环①：run_tools -> chef_think（红色粗线，下方小 U 型） ============ -->
  <path d="M 820 658 L 820 705 L 480 705 L 480 658" fill="none" stroke="#c02020" stroke-width="2.5" marker-end="url(#arrow-loop)"/>
  <text x="600" y="725" font-size="12" fill="#c02020" font-weight="bold">回环① 工具循环 · 普通边</text>

  <!-- ============ 回环②：verify_answer --retry--> chef_think（红色粗线，右侧通道上绕） ============ -->
  <path d="M 540 954 L 620 954 L 620 624 L 540 624" fill="none" stroke="#c02020" stroke-width="2.5" marker-end="url(#arrow-loop)"/>
  <text x="630" y="800" font-size="12" fill="#c02020" font-weight="bold">回环② retry 打回重生成</text>
  <text x="630" y="816" font-size="11" fill="#c02020">最多 3 次 · 条件边</text>

  <!-- ==================== 节点 ==================== -->

  <!-- condense_history（金色） -->
  <rect x="300" y="90" width="240" height="68" rx="10" fill="#c89028" stroke="#a07018" stroke-width="1.5"/>
  <text x="420" y="118" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">condense_history</text>
  <text x="420" y="140" text-anchor="middle" font-size="12" fill="#fff">长对话压缩 · 图的入口节点</text>

  <!-- ingredient_gate（红色） -->
  <rect x="300" y="210" width="240" height="68" rx="10" fill="#a82020" stroke="#7a1616" stroke-width="1.5"/>
  <text x="420" y="238" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">ingredient_gate</text>
  <text x="420" y="260" text-anchor="middle" font-size="12" fill="#fff">图片食材确认门 · 零 LLM</text>

  <!-- profile_gate（红色） -->
  <rect x="300" y="330" width="240" height="68" rx="10" fill="#a82020" stroke="#7a1616" stroke-width="1.5"/>
  <text x="420" y="358" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">profile_gate</text>
  <text x="420" y="380" text-anchor="middle" font-size="12" fill="#fff">充分性门控 · 零 LLM</text>

  <!-- requested_dish_gate（红色，去掉金框徽章） -->
  <rect x="300" y="450" width="240" height="68" rx="10" fill="#a82020" stroke="#7a1616" stroke-width="1.5"/>
  <text x="420" y="478" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">requested_dish_gate</text>
  <text x="420" y="500" text-anchor="middle" font-size="12" fill="#fff">点名菜生成前硬拦截 · 零 LLM</text>

  <!-- chef_think（金色） -->
  <rect x="300" y="590" width="240" height="68" rx="10" fill="#c89028" stroke="#a07018" stroke-width="1.5"/>
  <text x="420" y="618" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">chef_think</text>
  <text x="420" y="640" text-anchor="middle" font-size="12" fill="#fff">语义决策 · 决定调哪些工具</text>

  <!-- run_tools（蓝色） -->
  <rect x="700" y="590" width="240" height="68" rx="10" fill="#1e5aa8" stroke="#164078" stroke-width="1.5"/>
  <text x="820" y="618" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">run_tools</text>
  <text x="820" y="640" text-anchor="middle" font-size="12" fill="#fff">工具执行（执行器，非决策）</text>

  <!-- tool_budget_finalize（金色，左侧） -->
  <rect x="10" y="590" width="240" height="68" rx="10" fill="#c89028" stroke="#a07018" stroke-width="1.5"/>
  <text x="130" y="618" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">tool_budget_finalize</text>
  <text x="130" y="640" text-anchor="middle" font-size="12" fill="#fff">预算耗尽收口</text>

  <!-- verify_answer（红色） -->
  <rect x="300" y="920" width="240" height="68" rx="10" fill="#a82020" stroke="#7a1616" stroke-width="1.5"/>
  <text x="420" y="948" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">verify_answer</text>
  <text x="420" y="970" text-anchor="middle" font-size="12" fill="#fff">健康护栏审计 · 产出四态 · 零 LLM</text>

  <!-- allergen_block（红色，右侧） -->
  <rect x="700" y="920" width="240" height="68" rx="10" fill="#a82020" stroke="#7a1616" stroke-width="1.5"/>
  <text x="820" y="948" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">allergen_block</text>
  <text x="820" y="970" text-anchor="middle" font-size="12" fill="#fff">过敏原硬拦截 · 零 LLM</text>

  <!-- structure_answer（金色） -->
  <rect x="300" y="1060" width="240" height="68" rx="10" fill="#c89028" stroke="#a07018" stroke-width="1.5"/>
  <text x="420" y="1088" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">structure_answer</text>
  <text x="420" y="1110" text-anchor="middle" font-size="12" fill="#fff">结构化收口（含二次过敏原复核）</text>

  <!-- profile_memory（蓝色） -->
  <rect x="300" y="1180" width="240" height="68" rx="10" fill="#1e5aa8" stroke="#164078" stroke-width="1.5"/>
  <text x="420" y="1208" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">profile_memory</text>
  <text x="420" y="1230" text-anchor="middle" font-size="12" fill="#fff">画像候选（已启用）</text>

  <!-- ingredient_confirm（蓝色，右上） -->
  <rect x="700" y="210" width="240" height="68" rx="10" fill="#1e5aa8" stroke="#164078" stroke-width="1.5"/>
  <text x="820" y="238" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">ingredient_confirm</text>
  <text x="820" y="260" text-anchor="middle" font-size="12" fill="#fff">确定性食材清单 · 零 LLM</text>

  <!-- ask_user（金色，右上） -->
  <rect x="700" y="330" width="240" height="68" rx="10" fill="#c89028" stroke="#a07018" stroke-width="1.5"/>
  <text x="820" y="358" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">ask_user</text>
  <text x="820" y="380" text-anchor="middle" font-size="12" fill="#fff">健康画像追问</text>

  <!-- END -->
  <rect x="260" y="1310" width="320" height="56" rx="28" fill="#1e2a4a" stroke="#121a30" stroke-width="1.5"/>
  <text x="420" y="1345" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">END · 本轮结束</text>

  <!-- ==================== 图例 ==================== -->
  <line x1="40" y1="1410" x2="1240" y2="1410" stroke="#ccc" stroke-width="1"/>

  <rect x="40" y="1430" width="18" height="18" fill="#a82020"/>
  <text x="66" y="1444" font-size="13" fill="#333">否决权节点（零 LLM，能否决/打回）</text>

  <rect x="340" y="1430" width="18" height="18" fill="#1e5aa8"/>
  <text x="366" y="1444" font-size="13" fill="#333">确定型节点（零 LLM，无否决权）</text>

  <rect x="640" y="1430" width="18" height="18" fill="#c89028"/>
  <text x="666" y="1444" font-size="13" fill="#333">概率型节点（调大模型）</text>

  <line x1="40" y1="1475" x2="90" y2="1475" stroke="#555" stroke-width="1.5"/>
  <text x="100" y="1480" font-size="13" fill="#333">普通边</text>

  <line x1="200" y1="1475" x2="250" y2="1475" stroke="#777" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="260" y="1480" font-size="13" fill="#333">条件边</text>

  <line x1="360" y1="1475" x2="410" y2="1475" stroke="#c02020" stroke-width="2.5"/>
  <text x="420" y="1480" font-size="13" fill="#333">回环 × 2（已标红加粗）</text>

  <!-- ==================== 底部说明 ==================== -->
  <text x="40" y="1530" font-size="13" fill="#a82020" font-weight="bold">核心循环：</text>
  <text x="120" y="1530" font-size="13" fill="#333">chef_think —(tools)→ run_tools →（回环① 普通边）→ chef_think；verify_answer —(回环② 条件边 retry 打回重生成·最多 3 次)→ chef_think；两条回环都受重试上限与工具预算约束。</text>

  <text x="40" y="1560" font-size="13" fill="#a82020" font-weight="bold">状态流转：</text>
  <text x="120" y="1560" font-size="13" fill="#333">condense_history → ingredient_gate —(ready)→ profile_gate —(ready)→ requested_dish_gate —(pass)→ chef_think → verify_answer → structure_answer → profile_memory → END。</text>

  <text x="40" y="1590" font-size="13" fill="#a82020" font-weight="bold">硬拦截：</text>
  <text x="120" y="1590" font-size="13" fill="#333">requested_dish_gate（点名·生成前硬拦截）——命中已确认过敏原时不出模型、直接返回确定性拦截包（recipes 为空，不出卡片不配图），避免"先出一版再被换掉"。</text>

  <text x="40" y="1620" font-size="13" fill="#a82020" font-weight="bold">节点分型：</text>
  <text x="120" y="1620" font-size="13" fill="#333">概率型 5 个 / 确定型 8 个。概率型 = chef_think · structure_answer · condense_history · ask_user · tool_budget_finalize；</text>
  <text x="120" y="1642" font-size="13" fill="#333">确定型 = ingredient_gate · profile_gate · requested_dish_gate · verify_answer · allergen_block · run_tools · ingredient_confirm · profile_memory。</text>

  <text x="40" y="1680" font-size="12" fill="#999">v2 排版变更：移除 requested_dish_gate 的"本次新增"金框徽章；回环①收为 chef_think↔run_tools 下方小 U 型；回环②走右侧独立通道上绕；旁路 END 母线统一到 x=1100。</text>
</svg>
</body>
</html>
